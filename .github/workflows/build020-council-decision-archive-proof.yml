name: Build 020 Council Decision Archive Proof

on:
  push:
    branches: ['agent/build020-tax-payment-graph']
    paths:
      - 'data/generated/council_archive.json'
      - 'data/generated/council_decisions.json'
      - 'data/council_decision_sources.json'
      - 'scripts/ingest_council_decisions.py'
      - 'scripts/ingest_council_archive_decisions_build020.py'
      - 'scripts/validate_council_archive_decisions_build020.py'
      - '.github/workflows/build020-council-decision-archive-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate full historical collector syntax
        run: python -m compileall -q scripts/ingest_council_archive_decisions_build020.py scripts/validate_council_archive_decisions_build020.py
      - name: Parse all historical Regional Council minutes
        run: python scripts/ingest_council_archive_decisions_build020.py --output artifacts/build020-council-archive-decisions.json
      - name: Validate full archive coverage and seven seed controls
        run: python scripts/validate_council_archive_decisions_build020.py --candidate artifacts/build020-council-archive-decisions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build020-council-decision-archive-${{ github.sha }}
          path: artifacts/build020-council-archive-decisions.json
          if-no-files-found: warn
          retention-days: 14
