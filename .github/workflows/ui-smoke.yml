name: UI Smoke

on:
  push:
    branches: ['agent/design-analysis-ui-verification-20260825', 'agent/build-011-procurement-lifecycle', 'agent/build012-integrity-oversight', 'agent/build-013-context-data-expansion', 'agent/build-014-cao-amendment-series', 'agent/build-015-current-fiscal-refresh', 'agent/build-016-council-approval-graph', 'agent/build-017-audited-financial-history', 'agent/build-018-current-source-refresh']
  pull_request:
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'data/**'
      - 'tools/ui-smoke.mjs'
      - 'tools/build009-ui-smoke.mjs'
      - 'tools/build010-ui-smoke.mjs'
      - 'tools/build010-startup-race.mjs'
      - 'tools/build011-ui-smoke.mjs'
      - 'tools/build012-ui-smoke.mjs'
      - 'tools/build013-ui-smoke.mjs'
      - 'tools/build014-ui-smoke.mjs'
      - 'tools/build014-linkage-smoke.mjs'
      - 'tools/build015-ui-smoke.mjs'
      - 'tools/build016-ui-smoke.mjs'
      - 'tools/build017-ui-smoke.mjs'
      - 'tools/build018-ui-smoke.mjs'
      - '.github/workflows/ui-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve static application
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/halifaxdata-http.log 2>&1 &
          echo $! > /tmp/halifaxdata-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/halifaxdata-http.pid)" 2>/dev/null; then
              echo "Static server exited before becoming ready." >&2
              cat /tmp/halifaxdata-http.log >&2
              exit 1
            fi
            sleep 1
          done
          echo "Static server did not become ready within 20 seconds." >&2
          cat /tmp/halifaxdata-http.log >&2
          exit 1
      - name: Validate Build 010 startup ordering
        run: node tools/build010-startup-race.mjs
      - name: Capture and validate dashboard views
        run: node tools/ui-smoke.mjs
      - name: Validate Build 009 pattern surfaces
        run: node tools/build009-ui-smoke.mjs
      - name: Validate Build 010 current capital surfaces
        run: node tools/build010-ui-smoke.mjs
      - name: Validate Build 011 procurement lifecycle surfaces
        run: node tools/build011-ui-smoke.mjs
      - name: Validate Build 012 integrity oversight surfaces
        run: node tools/build012-ui-smoke.mjs
      - name: Validate Build 013 context expansion surfaces
        run: node tools/build013-ui-smoke.mjs
      - name: Validate Build 014 amendment series surfaces
        run: node tools/build014-ui-smoke.mjs
      - name: Validate Build 014 exact related-record links
        run: node tools/build014-linkage-smoke.mjs
      - name: Validate Build 015 current fiscal refresh
        run: node tools/build015-ui-smoke.mjs
      - name: Validate Build 016 Council decision evidence
        run: node tools/build016-ui-smoke.mjs
      - name: Validate Build 017 audited financial history
        run: node tools/build017-ui-smoke.mjs
      - name: Validate Build 018 current-source refresh
        run: node tools/build018-ui-smoke.mjs
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-${{ github.sha }}
          path: artifacts/ui-smoke
          if-no-files-found: warn
          retention-days: 14
