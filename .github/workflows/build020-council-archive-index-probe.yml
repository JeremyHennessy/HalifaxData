name: Build 020 Council Archive Index Probe

# Retry 2: standard-library HTTP so the probe tests Halifax transport/index shape directly.
on:
  push:
    branches: ['agent/build020-tax-payment-graph']
    paths: ['.github/workflows/build020-council-archive-index-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Halifax Regional Council index
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          url='https://www.halifax.ca/city-hall/regional-council'
          req=Request(url, headers={
              'User-Agent':'Mozilla/5.0 (compatible; HalifaxData/0.20; +https://github.com/JeremyHennessy/HalifaxData)',
              'Accept':'text/html,application/xhtml+xml'
          })
          with urlopen(req, timeout=60) as r:
              body=r.read()
              final_url=r.geturl()
              status=r.status
              content_type=r.headers.get('content-type')
          text=body.decode('utf-8', errors='replace')
          print('status', status, 'bytes', len(body), 'url', final_url, 'content-type', content_type)
          print('prefix', text[:300].replace('\n',' '))
          hrefs=re.findall(r'href=["\']([^"\']+)["\']', text, re.I)
          dated=[]
          for href in hrefs:
              absolute=urljoin(final_url,href)
              if '/city-hall/regional-council/' not in absolute:
                  continue
              if re.search(r'/[a-z]+-\d{1,2}-20\d{2}-(?:special-)?halifax-regional-council(?:$|[?#])', absolute, re.I):
                  dated.append(absolute.split('#',1)[0].split('?',1)[0])
          dated=sorted(set(dated))
          print('dated meeting links', len(dated))
          for item in dated[:250]:
              print(item)
          PY
