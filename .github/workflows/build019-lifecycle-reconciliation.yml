name: Build 019 Lifecycle Reconciliation

on:
  push:
    branches: ['agent/build-019-deterministic-lifecycle-reconciliation']
    paths:
      - 'data/generated/current_budget_2026_27.json'
      - 'data/generated/current_capital_2026_27_multiyear.json'
      - 'data/generated/current_capital.json'
      - 'data/generated/procurement.json'
      - 'data/generated/procurement_quarterly.json'
      - 'data/generated/contract_amendments.json'
      - 'data/generated/council_decisions.json'
      - 'data/generated/council_documents.json'
      - 'data/generated/lifecycle_reconciliation.json'
      - 'scripts/build_lifecycle_reconciliation_build019.py'
      - 'scripts/build_lifecycle_reconciliation_build019_v2.py'
      - 'scripts/build_lifecycle_reconciliation_build019_v3.py'
      - 'scripts/enrich_lifecycle_components_build019.py'
      - 'scripts/validate_lifecycle_reconciliation_build019.py'
      - 'scripts/validate_lifecycle_components_build019.py'
      - '.github/workflows/build019-lifecycle-reconciliation.yml'
  pull_request:
    paths:
      - 'data/generated/current_budget_2026_27.json'
      - 'data/generated/current_capital_2026_27_multiyear.json'
      - 'data/generated/current_capital.json'
      - 'data/generated/procurement.json'
      - 'data/generated/procurement_quarterly.json'
      - 'data/generated/contract_amendments.json'
      - 'data/generated/council_decisions.json'
      - 'data/generated/council_documents.json'
      - 'data/generated/lifecycle_reconciliation.json'
      - 'scripts/build_lifecycle_reconciliation_build019.py'
      - 'scripts/build_lifecycle_reconciliation_build019_v2.py'
      - 'scripts/build_lifecycle_reconciliation_build019_v3.py'
      - 'scripts/enrich_lifecycle_components_build019.py'
      - 'scripts/validate_lifecycle_reconciliation_build019.py'
      - 'scripts/validate_lifecycle_components_build019.py'
      - '.github/workflows/build019-lifecycle-reconciliation.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Build 019 Python syntax
        run: python -m compileall -q scripts/build_lifecycle_reconciliation_build019.py scripts/build_lifecycle_reconciliation_build019_v2.py scripts/build_lifecycle_reconciliation_build019_v3.py scripts/enrich_lifecycle_components_build019.py scripts/validate_lifecycle_reconciliation_build019.py scripts/validate_lifecycle_components_build019.py
      - name: Build deterministic exact-identifier evidence graph
        run: python scripts/build_lifecycle_reconciliation_build019_v3.py --output /tmp/lifecycle_base.json
      - name: Validate exact-identifier evidence graph
        run: python scripts/validate_lifecycle_reconciliation_build019.py /tmp/lifecycle_base.json
      - name: Build deterministic cross-identifier lifecycle components
        run: python scripts/enrich_lifecycle_components_build019.py /tmp/lifecycle_base.json /tmp/lifecycle_reconciliation.json
      - name: Validate final lifecycle reconciliation
        run: |
          python scripts/validate_lifecycle_reconciliation_build019.py /tmp/lifecycle_reconciliation.json
          python scripts/validate_lifecycle_components_build019.py /tmp/lifecycle_reconciliation.json
      - name: Preserve proof artifact
        run: |
          mkdir -p artifacts
          cp /tmp/lifecycle_reconciliation.json artifacts/lifecycle_reconciliation.json
      - name: Publish validated reconciliation to latest Build 019 branch head
        if: github.event_name == 'push' && github.ref_name == 'agent/build-019-deterministic-lifecycle-reconciliation'
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build019-publish "origin/$GITHUB_REF_NAME"
          cp /tmp/lifecycle_reconciliation.json data/generated/lifecycle_reconciliation.json
          python scripts/validate_lifecycle_reconciliation_build019.py data/generated/lifecycle_reconciliation.json
          python scripts/validate_lifecycle_components_build019.py data/generated/lifecycle_reconciliation.json
          if [ -z "$(git status --porcelain -- data/generated/lifecycle_reconciliation.json)" ]; then
            echo 'Checked Build 019 reconciliation artifact already matches deterministic rebuild.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/lifecycle_reconciliation.json
          git commit -m 'Build 019: publish deterministic lifecycle reconciliation'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Upload Build 019 reconciliation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build019-lifecycle-${{ github.sha }}
          path: artifacts/lifecycle_reconciliation.json
          if-no-files-found: warn
          retention-days: 14
