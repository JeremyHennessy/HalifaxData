name: Build 020 Audited History Combined Proof

on:
  push:
    branches: ['agent/build020-tax-payment-graph']
    paths:
      - 'data/audited_financial_sources.json'
      - 'scripts/ingest_financial_history.py'
      - 'scripts/ingest_financial_history_build017.py'
      - 'scripts/validate_financial_history_build017.py'
      - 'scripts/ingest_financial_2018_ocr_build020.py'
      - 'scripts/validate_financial_2018_ocr_build020.py'
      - 'scripts/combine_financial_history_build020.py'
      - 'scripts/validate_financial_history_build020.py'
      - '.github/workflows/build020-audited-history-combined-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Reproduce unchanged 2019-2025 standard audited history
        run: python scripts/ingest_financial_history_build017.py
      - name: Validate unchanged Build 017 audited history
        run: python scripts/validate_financial_history_build017.py
      - name: Generate proven 2018 OCR primary-statement candidate
        run: python scripts/ingest_financial_2018_ocr_build020.py --output artifacts/build020-financials-2018-ocr.json
      - name: Validate 2018 OCR candidate
        run: python scripts/validate_financial_2018_ocr_build020.py --candidate artifacts/build020-financials-2018-ocr.json
      - name: Combine 2018 OCR with unchanged 2019-2025 history
        run: |
          python scripts/combine_financial_history_build020.py \
            --base data/generated/financials.json \
            --base-tables data/generated/financials_document_tables.json \
            --ocr artifacts/build020-financials-2018-ocr.json \
            --output artifacts/build020-financials-combined.json \
            --table-output artifacts/build020-financials-document-tables-combined.json
      - name: Validate combined 2018-2025 candidate
        run: |
          python scripts/validate_financial_history_build020.py \
            --base data/generated/financials.json \
            --base-tables data/generated/financials_document_tables.json \
            --combined artifacts/build020-financials-combined.json \
            --combined-tables artifacts/build020-financials-document-tables-combined.json
      - uses: actions/upload-artifact@v4
        with:
          name: build020-audited-history-combined-${{ github.sha }}
          path: |
            artifacts/build020-financials-2018-ocr.json
            artifacts/build020-financials-combined.json
            artifacts/build020-financials-document-tables-combined.json
          retention-days: 14
