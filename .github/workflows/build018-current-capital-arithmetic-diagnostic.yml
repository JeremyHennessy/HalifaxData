name: Build 018 Current Capital Arithmetic Diagnostic

on:
  push:
    branches: ['agent/build-018-current-source-refresh']
    paths:
      - '.github/workflows/build018-current-capital-arithmetic-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Reconcile project rows to source subtotal and grand-total rows
        run: |
          python - <<'PY'
          import io
          import json
          from pathlib import Path
          import pdfplumber
          import requests
          import sys
          sys.path.insert(0, 'scripts')
          import ingest_current_capital_build018 as cap

          cfg = json.loads(Path('data/current_capital_sources.json').read_text(encoding='utf-8'))
          source = cfg['schedule_source']
          session = requests.Session()
          session.headers.update({'User-Agent': cap.UA})
          resolved_url = cap.resolve_attachment(session, source)
          blob = cap.fetch_pdf(session, source, resolved_url)
          with pdfplumber.open(io.BytesIO(blob)) as pdf:
              tables = pdf.pages[source['attachment_pdf_page'] - 1].extract_tables() or []
              if len(tables) != 1:
                  raise SystemExit(f'expected one Attachment 2 table, found {len(tables)}')
              table = [[cap.clean(cell) for cell in (row or [])] for row in tables[0]]

          records = []
          schedule_class = None
          source_discrete = None
          source_ongoing = None
          source_grand = None
          retrieved_at = cfg['metadata']['last_researched'] + 'T00:00:00Z'
          for row_number, cells in enumerate(table[1:], 2):
              first = cap.clean(cells[0]); second = cap.clean(cells[1])
              if first == 'Discrete Projects':
                  schedule_class = 'discrete_project'; continue
              if first == 'Ongoing Programs':
                  schedule_class = 'ongoing_program'; continue
              if first == 'Subtotal Discrete Projects':
                  source_discrete = cap.parse_total_row(cells); continue
              if first == 'Subtotal Ongoing Programs':
                  source_ongoing = cap.parse_total_row(cells); continue
              if second == 'Grand Total 2026/27 Muti-Year Projects':
                  source_grand = cap.parse_total_row(cells); continue
              if not first and not second:
                  continue
              records.append(cap.parse_project_row(cells, schedule_class, row_number, source, resolved_url, retrieved_at))

          discrete = [r for r in records if r['schedule_class'] == 'discrete_project']
          ongoing = [r for r in records if r['schedule_class'] == 'ongoing_program']
          computed_discrete = cap.sum_records(discrete)
          computed_ongoing = cap.sum_records(ongoing)
          computed_all = cap.sum_records(records)

          print(f'discrete_rows={len(discrete)}')
          print(f'ongoing_rows={len(ongoing)}')
          print(f'computed_discrete={computed_discrete}')
          print(f'source_discrete={source_discrete}')
          print(f'computed_ongoing={computed_ongoing}')
          print(f'source_ongoing={source_ongoing}')
          print(f'computed_all={computed_all}')
          print(f'source_grand={source_grand}')

          def diffs(computed, source):
              return {
                  field: (computed.get(field), source.get(field), cap.value_or_zero(source.get(field)) - cap.value_or_zero(computed.get(field)))
                  for field in computed
                  if computed.get(field) != source.get(field)
              }

          print(f'discrete_diffs={diffs(computed_discrete, source_discrete)}')
          print(f'ongoing_diffs={diffs(computed_ongoing, source_ongoing)}')
          print(f'grand_diffs={diffs(computed_all, source_grand)}')
          PY
