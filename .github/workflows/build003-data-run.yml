name: Build 003 full data run

on:
  push:
    branches: ['agent/build-003-full-data-ingestion']
    paths: ['.github/workflows/build003-data-run.yml']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile collectors
        run: python -m compileall -q scripts
      - name: Expand verified source registry
        run: |
          python scripts/augment_sources.py
          python scripts/augment_sources_external.py
      - name: Acquire every ready source
        run: python scripts/acquire_sources.py
      - name: Build primary domain artifacts independently
        run: python scripts/ingest_domains.py
      - name: Build budget history
        run: python scripts/ingest_budget_history.py
      - name: Build audited financial history
        run: python scripts/ingest_financial_history.py
      - name: Build quarterly spending summaries
        run: python scripts/ingest_quarterly_spending.py
      - name: Build capital plan history
        run: python scripts/ingest_capital_history.py
      - name: Build municipal benchmarks and funding
        run: python scripts/ingest_municipal_benchmarks.py
      - name: Preserve collected branch evidence before validation
        run: |
          git config user.name "halifaxdata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/generated
          if git diff --cached --quiet; then
            echo "No collected data changes"
          else
            git commit -m "data: collect Build 003 public finance sources"
            git push
          fi
      - name: Validate compensation artifact
        run: python scripts/validate_data.py
      - name: Validate domain artifacts
        run: python scripts/validate_domains.py
