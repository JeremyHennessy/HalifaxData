name: Build normalized entity index

on:
  push:
    branches: ['agent/build-005-normalization']
    paths:
      - 'scripts/build_entity_index.py'
      - 'scripts/build_entity_index_v4.py'
      - 'scripts/validate_entity_index_v4.py'
      - 'scripts/validate_budget_history.py'
      - 'scripts/validate_financial_history.py'
      - 'scripts/validate_municipal_benchmarks.py'
      - 'scripts/validate_council.py'
      - 'scripts/validate_spending.py'
      - 'data/generated/budget.json'
      - 'data/generated/compensation.json'
      - 'data/generated/procurement.json'
      - 'data/generated/capital.json'
      - 'data/generated/spending.json'
      - 'data/generated/financials.json'
      - 'data/generated/budget_history.json'
      - 'data/generated/benchmarks.json'
      - 'data/generated/external_funding.json'
      - 'data/generated/council.json'
      - 'data/generated/council_documents.json'
      - '.github/workflows/normalize-entities.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-005-normalization
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-005-normalization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every approved normalization input
        run: |
          python scripts/validate_data.py
          python scripts/validate_budget_history.py
          python scripts/validate_financial_history.py
          python scripts/validate_municipal_benchmarks.py
          python scripts/validate_council.py
          python scripts/validate_spending.py
      - name: Build final normalized entity index
        run: python scripts/build_entity_index_v4.py
      - name: Independently validate final normalized entity index
        run: |
          python scripts/build_entity_index_v4.py --check
          python scripts/validate_entity_index_v4.py
          git diff --check
      - name: Commit normalized artifact
        run: |
          if [ -z "$(git status --porcelain -- data/generated/entity_index.json)" ]; then
            echo "Normalized entity index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/entity_index.json
          git commit -m "Build 005: refresh final normalized entity index"
          git push origin HEAD:agent/build-005-normalization
