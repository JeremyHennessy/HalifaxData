name: Build 013 Source Diagnostic

on:
  pull_request:
    paths:
      - 'scripts/build013_source_diagnostic.py'
      - '.github/workflows/build013-source-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run source diagnostic
        run: python scripts/build013_source_diagnostic.py
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: build013-source-diagnostic-${{ github.sha }}
          path: artifacts/build013-source-diagnostic.json
          if-no-files-found: error
          retention-days: 7
