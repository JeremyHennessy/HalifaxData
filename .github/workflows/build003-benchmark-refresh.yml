name: Build 003 source repair

on:
  push:
    branches: ['agent/build-003-full-data-ingestion']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Upsert verified source endpoints
        run: python scripts/augment_sources_external.py
      - name: Rebuild source acquisition manifest
        run: python scripts/acquire_sources.py
      - name: Rebuild municipal benchmarks and funding context
        run: python scripts/ingest_municipal_benchmarks.py
      - name: Validate multi-domain artifacts
        run: python scripts/validate_domains.py
      - name: Commit synchronized source/data changes
        run: |
          if git diff --quiet -- data/sources.json data/generated/source_acquisition.json data/generated/benchmarks.json data/generated/external_funding.json; then
            echo 'No synchronized source/data changes'
            exit 0
          fi
          git config user.name 'halifaxdata-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sources.json data/generated/source_acquisition.json data/generated/benchmarks.json data/generated/external_funding.json
          git commit -m 'data: synchronize municipal base datasets and acquisition manifest'
          git push
