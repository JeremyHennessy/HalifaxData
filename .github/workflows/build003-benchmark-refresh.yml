name: Build 003 benchmark refresh

on:
  push:
    branches: ['agent/build-003-full-data-ingestion']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Rebuild municipal benchmarks and funding context
        run: python scripts/ingest_municipal_benchmarks.py
      - name: Inspect rebuilt metadata
        run: |
          python - <<'PY'
          import json
          for name in ['benchmarks.json','external_funding.json']:
              d=json.load(open('data/generated/'+name))
              print(name, json.dumps(d['metadata'], indent=2))
          PY
      - name: Commit regenerated benchmark artifacts
        run: |
          if git diff --quiet -- data/generated/benchmarks.json data/generated/external_funding.json; then
            echo 'No benchmark changes'
            exit 0
          fi
          git config user.name 'halifaxdata-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/benchmarks.json data/generated/external_funding.json
          git commit -m 'data: regenerate municipal benchmarks with scoped selection'
          git push
