name: Build 018 Current Capital Proof

on:
  push:
    branches: ['agent/build-018-current-source-refresh', main]
    paths:
      - 'data/current_capital_sources.json'
      - 'data/generated/current_capital_2026_27_multiyear.json'
      - 'data/current_source_refresh_status.json'
      - 'scripts/ingest_current_capital_build018.py'
      - 'scripts/validate_current_capital_build018.py'
      - 'build018-current-source-refresh.js'
      - 'tools/build018-ui-smoke.mjs'
      - 'index.html'
      - 'docs/build018-current-source-refresh.md'
      - 'docs/source-map.md'
      - '.github/workflows/build018-current-budget-proof.yml'
      - '.github/workflows/build018-current-capital-proof.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ui-smoke.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'data/current_capital_sources.json'
      - 'data/generated/current_capital_2026_27_multiyear.json'
      - 'data/current_source_refresh_status.json'
      - 'scripts/ingest_current_capital_build018.py'
      - 'scripts/validate_current_capital_build018.py'
      - 'build018-current-source-refresh.js'
      - 'tools/build018-ui-smoke.mjs'
      - 'index.html'
      - 'docs/build018-current-source-refresh.md'
      - 'docs/source-map.md'
      - '.github/workflows/build018-current-budget-proof.yml'
      - '.github/workflows/build018-current-capital-proof.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ui-smoke.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate Build 018 current-capital Python syntax
        run: python -m compileall -q scripts/ingest_current_capital_build018.py scripts/validate_current_capital_build018.py
      - name: Reproduce approved-current 2026/27 capital schedule
        if: github.event_name == 'push' && github.ref_name == 'agent/build-018-current-source-refresh'
        run: python scripts/ingest_current_capital_build018.py
      - name: Validate checked current-capital evidence contract
        run: python scripts/validate_current_capital_build018.py
      - name: Verify registered capital source identity and March 31 approval source
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import requests

          import hashlib

          config = json.loads(Path('data/current_capital_sources.json').read_text(encoding='utf-8'))
          artifact = json.loads(Path('data/generated/current_capital_2026_27_multiyear.json').read_text(encoding='utf-8'))
          schedule = config['schedule_source']
          approval = config['approval_source']
          meta = artifact.get('metadata') or {}
          if meta.get('source_id') != schedule.get('id'):
              raise SystemExit('checked current-capital artifact lost registered source ID')
          if meta.get('source_url_registry') != schedule.get('previous_indexed_attachment_url'):
              raise SystemExit('checked current-capital artifact lost preserved registry attachment identity')
          if meta.get('source_url_resolved') != schedule.get('known_live_attachment_url'):
              raise SystemExit('checked current-capital artifact lost resolved attachment identity')
          if len(str(meta.get('source_sha256') or '')) != 64:
              raise SystemExit('checked current-capital artifact is missing its source SHA-256')

          session=requests.Session()
          session.headers.update({'User-Agent': 'HalifaxData/0.22 (+https://github.com/JeremyHennessy/HalifaxData)'})
          agenda=session.get(schedule['agenda_url'], timeout=120)
          agenda.raise_for_status()
          agenda_text=re.sub(r'\s+', ' ', agenda.text)
          if schedule['attachment_visible_title'] not in agenda_text:
              raise SystemExit('capital agenda no longer exposes the exact registered attachment title')
          document_id=schedule['known_live_attachment_url'].split('DocumentId=')[-1]
          if f'DocumentId={document_id}' not in agenda.text:
              raise SystemExit(f'capital agenda no longer references registered live DocumentId={document_id}')

          pdf=session.get(schedule['known_live_attachment_url'], headers={'Referer': schedule['agenda_url']}, timeout=120)
          if pdf.status_code == 200:
              if 'pdf' not in str(pdf.headers.get('content-type') or '').lower():
                  raise SystemExit(f"capital source returned 200 but not PDF: {pdf.headers.get('content-type')!r}")
              digest=hashlib.sha256(pdf.content).hexdigest()
              if digest != meta.get('source_sha256'):
                  raise SystemExit(f'live capital PDF hash changed: {digest}')
              transport='live_pdf_hash_verified'
          elif pdf.status_code == 403:
              transport='pdf_transport_blocked_403_checked_hash_preserved'
          else:
              raise SystemExit(f"unexpected capital PDF transport status: {pdf.status_code}")

          response = session.get(approval['url'], timeout=120)
          response.raise_for_status()
          text = re.sub(r'\s+', ' ', response.text)
          required = [
              'Ratification from Budget Committee',
              'Proposed 2026/27 Budget',
              'Resolution for Approval of Operating Budgets, Capital Plan and Tax Rates for Fiscal 2026/27',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'capital approval source missing required text: {missing}')
          print(f'March 31, 2026 Capital Plan ratification verified; capital PDF transport={transport}')
          PY
      - name: Preserve proof artifact
        run: |
          mkdir -p artifacts
          cp data/generated/current_capital_2026_27_multiyear.json artifacts/current_capital_2026_27_multiyear.json
          cp data/generated/current_capital_2026_27_multiyear.json /tmp/build018-current-capital.json
      - name: Publish reproduced current capital to latest Build 018 branch head
        if: github.event_name == 'push' && github.ref_name == 'agent/build-018-current-source-refresh'
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build018-capital-publish "origin/$GITHUB_REF_NAME"
          cp /tmp/build018-current-capital.json data/generated/current_capital_2026_27_multiyear.json
          python scripts/validate_current_capital_build018.py
          if [ -z "$(git status --porcelain -- data/generated/current_capital_2026_27_multiyear.json)" ]; then
            echo 'Checked Build 018 current-capital artifact already reproduces exactly.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/current_capital_2026_27_multiyear.json
          git commit -m 'Build 018: publish current capital schedule'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build018-current-capital-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
