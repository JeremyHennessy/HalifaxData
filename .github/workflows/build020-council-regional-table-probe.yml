name: Build 020 Council Regional Table Probe

# Retry 2: resolve the Drupal form target before parsing the Regional Council table.
on:
  push:
    branches: ['agent/build020-tax-payment-graph']
    paths: ['.github/workflows/build020-council-regional-table-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Regional Council filtered table endpoint
        run: |
          python - <<'PY'
          import html, re
          from urllib.error import HTTPError
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          headers={'User-Agent':'Mozilla/5.0 (compatible; HalifaxData/0.20; +https://github.com/JeremyHennessy/HalifaxData)','Accept':'text/html,application/xhtml+xml'}
          landing='https://www.halifax.ca/city-hall/agendas-meetings-reports'
          req=Request(landing,headers=headers)
          with urlopen(req,timeout=60) as r:
            landing_text=r.read().decode('utf-8',errors='replace'); landing_final=r.geturl()
          base_match=re.search(r'<base[^>]+href=["\']([^"\']+)',landing_text,re.I)
          base_url=urljoin(landing_final,html.unescape(base_match.group(1))) if base_match else None
          form_match=re.search(r'<form\b[^>]*\baction=["\']([^"\']*)["\'][^>]*class=["\'][^"\']*views-exposed-form[^"\']*["\']',landing_text,re.I|re.S)
          form_action=html.unescape(form_match.group(1)) if form_match else 'meetings'
          print('landing',landing_final,'base',base_url,'form_action',form_action)

          candidates=[
            urljoin(landing_final,form_action),
            urljoin(base_url,form_action) if base_url else None,
            landing_final+'?category=931&page=0',
            landing_final.rstrip('/')+'/meetings?category=931&page=0',
            'https://www.halifax.ca/city-hall/meetings/?category=931&page=0',
          ]
          seen=set()
          for raw in candidates:
            if not raw: continue
            url=raw if '?' in raw else raw+'?category=931&page=0'
            if url in seen: continue
            seen.add(url)
            print('\nCANDIDATE',url)
            try:
              req=Request(url,headers=headers)
              with urlopen(req,timeout=60) as r:
                body=r.read(); final=r.geturl(); status=r.status
            except HTTPError as exc:
              print('HTTP_ERROR',exc.code,exc.reason)
              continue
            text=body.decode('utf-8',errors='replace')
            print('status',status,'bytes',len(body),'final',final)
            result=re.search(r'<h3[^>]*>\s*([\d,]+)\s+Results\s*</h3>',text,re.I)
            print('result_count',result.group(1) if result else None)
            tables=re.findall(r'(<table\b[^>]*>.*?</table>)',text,re.I|re.S)
            for ti,table in enumerate(tables):
              if not re.search(r'\bDate\b',table,re.I) or not re.search(r'\bAgenda\b',table,re.I): continue
              rows=re.findall(r'<tr\b[^>]*>(.*?)</tr>',table,re.I|re.S)
              print('MEETING_TABLE',ti,'rows',len(rows))
              for ri,row in enumerate(rows[:8]):
                cells=[]
                for cell in re.findall(r'<t[dh]\b[^>]*>(.*?)</t[dh]>',row,re.I|re.S):
                  cells.append(' '.join(html.unescape(re.sub(r'<[^>]+>',' ',cell)).split()))
                links=[urljoin(final,html.unescape(x)) for x in re.findall(r'href=["\']([^"\']+)',row,re.I)]
                print('ROW',ri,'CELLS',cells,'LINKS',links)
            pager=[]
            for href,label in re.findall(r'<a[^>]+href=["\']([^"\']*page=\d+[^"\']*)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
              pager.append((' '.join(html.unescape(re.sub(r'<[^>]+>',' ',label)).split()),urljoin(final,html.unescape(href))))
            print('pager_tail',pager[-20:])
          PY
