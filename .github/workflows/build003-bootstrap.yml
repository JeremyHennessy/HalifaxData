name: Build 003 bootstrap

on:
  push:
    branches: ['agent/build-003-full-data-ingestion']

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Port validated compensation ingestion without touching dashboard UI
        run: |
          git fetch origin agent/build-002-compensation-bootstrap
          git checkout origin/agent/build-002-compensation-bootstrap -- data/generated/compensation.json scripts/ingest_compensation.py scripts/validate_data.py
      - name: Validate ported compensation data
        run: |
          python -m compileall -q scripts
          python scripts/validate_data.py
      - name: Commit port
        run: |
          git config user.name "halifaxdata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/compensation.json scripts/ingest_compensation.py scripts/validate_data.py
          git commit -m "build 003: port verified compensation history onto dashboard baseline"
          git push
