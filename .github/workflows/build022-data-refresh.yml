name: Build 022 Controlled Data Refresh

on:
  workflow_dispatch:
  push:
    branches: ['agent/build022-freshness-usability']
    paths:
      - '.github/workflows/build022-data-refresh.yml'
      - 'scripts/ingest_council_decisions.py'
      - 'scripts/ingest_council_decisions_postminutes_build022.py'
      - 'scripts/diagnose_council_postminutes_html_build022.py'
      - 'scripts/validate_council_reference_extraction_build022.py'
      - 'scripts/build_lifecycle_reconciliation_build019.py'
      - 'scripts/validate_lifecycle_reconciliation_build019.py'
      - 'scripts/validate_build022_release_controls.py'

permissions:
  contents: write

concurrency:
  group: build022-controlled-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate refresh syntax
        run: |
          python -m compileall -q \
            scripts/ingest_procurement.py \
            scripts/ingest_council.py \
            scripts/ingest_council_documents.py \
            scripts/ingest_council_decisions.py \
            scripts/validate_council_reference_extraction_build022.py \
            scripts/diagnose_council_postminutes_html_build022.py \
            scripts/ingest_council_decisions_postminutes_build022.py \
            scripts/build_entity_index_v4.py \
            scripts/build_lifecycle_reconciliation_build019_v4.py \
            scripts/enrich_lifecycle_components_build019.py \
            scripts/build_lifecycle_investigations_build019.py \
            scripts/validate_build022_release_controls.py
      - name: Validate Council reference extraction
        run: python scripts/validate_council_reference_extraction_build022.py
      - name: Preserve checked release inputs
        run: |
          cp data/generated/procurement.json /tmp/checked-procurement.json
          cp data/generated/council.json /tmp/checked-council.json
          cp data/generated/council_documents.json /tmp/checked-council-documents.json
          cp data/generated/council_decisions.json /tmp/checked-council-decisions.json
          cp data/generated/entity_index.json /tmp/checked-entity-index.json
          cp data/generated/lifecycle_reconciliation.json /tmp/checked-lifecycle-reconciliation.json
          cp data/generated/lifecycle_investigations.json /tmp/checked-lifecycle-investigations.json
      - name: Collect live Nova Scotia Halifax awarded tenders without publishing
        run: |
          mkdir -p artifacts/build022-refresh
          python scripts/ingest_procurement.py --output artifacts/build022-refresh/procurement_live.json
          python - <<'PY'
          import json
          from pathlib import Path
          checked=json.loads(Path('/tmp/checked-procurement.json').read_text(encoding='utf-8'))
          live=json.loads(Path('artifacts/build022-refresh/procurement_live.json').read_text(encoding='utf-8'))
          def key(row):
              return (row.get('award_id'),row.get('vendor_name'),row.get('awarded_date'),row.get('original_award_value'))
          checked_keys={key(row) for row in checked.get('records') or []}
          live_keys={key(row) for row in live.get('records') or []}
          summary={
              'checked_records':len(checked_keys),
              'live_records':len(live_keys),
              'new_normalized_award_keys':len(live_keys-checked_keys),
              'missing_from_live_normalized_award_keys':len(checked_keys-live_keys),
              'source_query_record_count':(live.get('metadata') or {}).get('source_query_record_count'),
              'publication_status':'review_candidate_only',
              'reason':'Build 022 keeps procurement out of this release until stable lifecycle record identity is migrated separately.'
          }
          Path('artifacts/build022-refresh/procurement_diff.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
      - name: Refresh current Council meeting inventory
        run: python scripts/ingest_council.py
      - name: Refresh current Council document inventory
        run: python scripts/ingest_council_documents.py
      - name: Validate current Council graph
        run: python scripts/validate_council.py
      - name: Refresh approved Council decisions through controlled PostMinutes adapter
        run: |
          mkdir -p artifacts/build022-refresh
          python scripts/ingest_council_decisions_postminutes_build022.py \
            --checked /tmp/checked-council-decisions.json \
            --output data/generated/council_decisions.json \
            --summary-output artifacts/build022-refresh/council_incremental_summary.json
      - name: Validate Council decision evidence
        run: python scripts/validate_council_decisions.py
      - name: Regenerate normalized entity index
        run: |
          python scripts/build_entity_index_v4.py
          python scripts/validate_entity_index_v4.py
      - name: Regenerate deterministic lifecycle graph
        run: |
          python scripts/build_lifecycle_reconciliation_build019_v4.py --output /tmp/lifecycle_base.json
          python scripts/validate_lifecycle_reconciliation_build019.py /tmp/lifecycle_base.json
          python scripts/validate_capital_identifier_policy_build019.py /tmp/lifecycle_base.json
          python scripts/enrich_lifecycle_components_build019.py /tmp/lifecycle_base.json data/generated/lifecycle_reconciliation.json
          python scripts/validate_lifecycle_reconciliation_build019.py
          python scripts/validate_capital_identifier_policy_build019.py
          python scripts/validate_lifecycle_components_build019.py
      - name: Regenerate lifecycle investigation queue
        run: |
          python scripts/build_lifecycle_investigations_build019.py
          python scripts/validate_lifecycle_investigations_build019.py
      - name: Record exact Build 022 evidence delta
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          checked_proc=load('/tmp/checked-procurement.json')
          live_proc=load('artifacts/build022-refresh/procurement_live.json')
          checked_council=load('/tmp/checked-council.json')
          live_council=load('data/generated/council.json')
          checked_decisions=load('/tmp/checked-council-decisions.json')
          live_decisions=load('data/generated/council_decisions.json')
          checked_lifecycle=load('/tmp/checked-lifecycle-reconciliation.json')
          live_lifecycle=load('data/generated/lifecycle_reconciliation.json')
          checked_investigations=load('/tmp/checked-lifecycle-investigations.json')
          live_investigations=load('data/generated/lifecycle_investigations.json')

          def award_key(row):
              return (
                  row.get('award_id'),
                  row.get('vendor_name'),
                  row.get('awarded_date'),
                  row.get('original_award_value'),
              )

          def evidence_signature(link):
              e=link.get('evidence') or {}
              return (
                  link.get('identifier_type'),
                  link.get('identifier_value'),
                  e.get('domain'),
                  e.get('record_type'),
                  e.get('record_key'),
                  link.get('source_field'),
              )

          checked_awards={award_key(row):row for row in checked_proc.get('records') or []}
          live_awards={award_key(row):row for row in live_proc.get('records') or []}
          new_awards=[live_awards[key] for key in sorted(set(live_awards)-set(checked_awards), key=str)]
          missing_awards=[checked_awards[key] for key in sorted(set(checked_awards)-set(live_awards), key=str)]

          checked_decision_ids={row['decision_id'] for row in checked_decisions.get('records') or []}
          new_decision_rows=[
              row for row in live_decisions.get('records') or []
              if row.get('decision_id') not in checked_decision_ids
          ]

          old_links={evidence_signature(row):row for row in checked_lifecycle.get('identifier_links') or []}
          new_links={evidence_signature(row):row for row in live_lifecycle.get('identifier_links') or []}
          added_links=[new_links[key] for key in sorted(set(new_links)-set(old_links), key=str)]
          removed_links=[old_links[key] for key in sorted(set(old_links)-set(new_links), key=str)]

          def compact_link(row):
              e=row.get('evidence') or {}
              return {
                  'identifier_type':row.get('identifier_type'),
                  'identifier_value':row.get('identifier_value'),
                  'domain':e.get('domain'),
                  'record_type':e.get('record_type'),
                  'record_key':e.get('record_key'),
                  'label':e.get('label'),
                  'meeting_date':e.get('meeting_date'),
                  'awarded_date':e.get('awarded_date'),
                  'vendor_name':e.get('vendor_name'),
                  'source_field':row.get('source_field'),
              }

          old_inv={row['investigation_id']:row for row in checked_investigations.get('investigations') or []}
          new_inv={row['investigation_id']:row for row in live_investigations.get('investigations') or []}
          inv_changes=[]
          for key in sorted(set(old_inv)&set(new_inv)):
              before,after=old_inv[key],new_inv[key]
              fields=('review_priority_score','priority','evidence_record_count','identifier_count')
              changed={field:{'before':before.get(field),'after':after.get(field)} for field in fields if before.get(field)!=after.get(field)}
              if changed:
                  inv_changes.append({
                      'investigation_id':key,
                      'title':after.get('title'),
                      'changes':changed,
                      'review_reasons':after.get('review_reasons'),
                      'domains':after.get('domains'),
                  })

          summary={
              'procurement':{
                  'checked_records':len(checked_awards),
                  'live_records':len(live_awards),
                  'new_awards':len(new_awards),
                  'missing_awards':len(missing_awards),
                  'new_award_rows':[
                      {k:row.get(k) for k in ('award_id','vendor_name','awarded_date','original_award_value','description','entity')}
                      for row in new_awards
                  ],
                  'missing_award_rows':[
                      {k:row.get(k) for k in ('award_id','vendor_name','awarded_date','original_award_value','description','entity')}
                      for row in missing_awards
                  ],
              },
              'council':{
                  'checked_meetings':len(checked_council.get('records') or []),
                  'live_meetings':len(live_council.get('records') or []),
                  'checked_decisions':len(checked_decision_ids),
                  'live_decisions':len(live_decisions.get('records') or []),
                  'new_decisions':len(new_decision_rows),
                  'new_decisions_by_date':dict(sorted(Counter(row.get('meeting_date') for row in new_decision_rows).items())),
                  'new_fiscal_relevant':sum(1 for row in new_decision_rows if row.get('fiscal_relevant')),
                  'new_money_mentions':sum(1 for row in new_decision_rows if row.get('money_mentions')),
              },
              'lifecycle':{
                  'checked_summary':checked_lifecycle.get('summary') or {},
                  'live_summary':live_lifecycle.get('summary') or {},
                  'added_identifier_links':len(added_links),
                  'removed_identifier_links':len(removed_links),
                  'added_links':[compact_link(row) for row in added_links],
                  'removed_links':[compact_link(row) for row in removed_links],
              },
              'investigations':{
                  'checked_summary':checked_investigations.get('summary') or {},
                  'live_summary':live_investigations.get('summary') or {},
                  'changed_existing_investigations':inv_changes,
                  'new_investigation_ids':sorted(set(new_inv)-set(old_inv)),
                  'removed_investigation_ids':sorted(set(old_inv)-set(new_inv)),
              },
              'interpretation':'This file describes source-backed release deltas only. It is not a finding of waste, misconduct, overpayment or illegality.'
          }
          Path('artifacts/build022-refresh/exact_delta.json').write_text(
              json.dumps(summary,indent=2,ensure_ascii=False)+'\n',
              encoding='utf-8'
          )
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - name: Validate reviewed Build 022 release controls
        run: python scripts/validate_build022_release_controls.py
      - name: Validate established contracts
        run: |
          python scripts/validate_data.py
          python scripts/validate_domain_status.py
          git diff --check
      - name: Record controlled refresh summary
        if: always()
        run: |
          mkdir -p artifacts/build022-refresh
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              p=Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}

          procurement=load('data/generated/procurement.json')
          procurement_live=load('artifacts/build022-refresh/procurement_live.json')
          procurement_diff=load('artifacts/build022-refresh/procurement_diff.json')
          council=load('data/generated/council.json')
          decisions=load('data/generated/council_decisions.json')
          lifecycle=load('data/generated/lifecycle_reconciliation.json')
          investigations=load('data/generated/lifecycle_investigations.json')
          summary={
              'procurement_checked_records': len(procurement.get('records') or []),
              'procurement_live_records': len(procurement_live.get('records') or []),
              'procurement_live_source_rows': (procurement_live.get('metadata') or {}).get('source_query_record_count'),
              'procurement_diff': procurement_diff,
              'council_meetings': len(council.get('records') or []),
              'council_decisions': len(decisions.get('records') or []),
              'legacy_source_mode': (decisions.get('metadata') or {}).get('legacy_source_mode'),
              'lifecycle_summary': lifecycle.get('summary') or {},
              'investigation_summary': investigations.get('summary') or {},
              'interpretation': 'Counts are evidence-release controls. Awards and Council approvals are not vendor-payment facts.'
          }
          Path('artifacts/build022-refresh/summary.json').write_text(json.dumps(summary, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
          cp /tmp/checked-procurement.json artifacts/build022-refresh/procurement_checked.json || true
          cp data/generated/council.json artifacts/build022-refresh/council.json || true
          cp data/generated/council_documents.json artifacts/build022-refresh/council_documents.json || true
          cp data/generated/council_decisions.json artifacts/build022-refresh/council_decisions.json || true
          cp data/generated/lifecycle_reconciliation.json artifacts/build022-refresh/lifecycle_reconciliation.json || true
          cp data/generated/lifecycle_investigations.json artifacts/build022-refresh/lifecycle_investigations.json || true
      - name: Publish validated refreshed evidence to branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/generated/council.json \
            data/generated/council_documents.json \
            data/generated/council_decisions.json \
            data/generated/entity_index.json \
            data/generated/lifecycle_reconciliation.json \
            data/generated/lifecycle_investigations.json
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No validated source-backed data changes to publish.'
            exit 0
          fi
          git commit -m 'Build 022: publish validated current public-data refresh'
          git push origin HEAD:'agent/build022-freshness-usability'
      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build022-controlled-refresh-${{ github.sha }}
          path: artifacts/build022-refresh
          if-no-files-found: warn
          retention-days: 14
