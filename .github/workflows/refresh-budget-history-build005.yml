name: Refresh Build 005 historical budgets

on:
  push:
    branches: ['agent/build-005-normalization']
    paths:
      - 'scripts/ingest_budget_history.py'
      - 'scripts/ingest_domains.py'
      - 'scripts/validate_budget_history.py'
      - 'data/sources.json'
      - '.github/workflows/refresh-budget-history-build005.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-005-budget-history-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-005-normalization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Validate Python syntax
        run: python -m compileall -q scripts
      - name: Collect conservative historical budgets
        run: python scripts/ingest_budget_history.py
      - name: Independently validate historical budgets
        run: |
          python scripts/validate_budget_history.py
          python scripts/validate_data.py
          git diff --check
      - name: Commit verified historical-budget artifacts
        run: |
          if [ -z "$(git status --porcelain -- data/generated/budget_history.json data/generated/budget_document_tables.json)" ]; then
            echo "Historical-budget artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/budget_history.json data/generated/budget_document_tables.json
          git commit -m "Build 005: refresh verified historical budgets"
          git push origin HEAD:agent/build-005-normalization
