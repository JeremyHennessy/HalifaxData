name: Build 020 2018 OCR Financial Proof

on:
  push:
    branches: ['agent/build020-tax-payment-graph']
    paths:
      - 'scripts/ingest_financial_2018_ocr_build020.py'
      - 'scripts/validate_financial_2018_ocr_build020.py'
      - '.github/workflows/build020-2018-ocr-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
          tesseract --version | head -1
          pdftoppm -v 2>&1 | head -1
      - name: Generate isolated 2018 OCR candidate
        run: python scripts/ingest_financial_2018_ocr_build020.py --output artifacts/build020-financials-2018-ocr.json
      - name: Validate 2018 OCR candidate and 2019 comparator agreement
        run: python scripts/validate_financial_2018_ocr_build020.py --candidate artifacts/build020-financials-2018-ocr.json
      - uses: actions/upload-artifact@v4
        with:
          name: build020-financials-2018-ocr-${{ github.sha }}
          path: artifacts/build020-financials-2018-ocr.json
          retention-days: 14
