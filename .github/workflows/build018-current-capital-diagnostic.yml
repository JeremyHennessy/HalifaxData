name: Build 018 Current Capital Diagnostic

on:
  push:
    branches: ['agent/build-018-current-source-refresh']
    paths:
      - '.github/workflows/build018-current-capital-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Resolve and inspect complete 2026/27 capital multi-year schedule
        run: |
          python - <<'PY'
          import html
          import io
          import re
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import requests
          import pdfplumber

          agenda_url = 'https://pub-halifax.escribemeetings.com/Meeting.aspx?Agenda=Agenda&Id=2dc5ed20-0349-47ab-89a0-a6d84e435b9a&lang=English'
          exact_title = '7 - Revised 202627 Multi-Year Capital Plan.pdf'
          session = requests.Session()
          session.headers.update({'User-Agent': 'HalifaxData/0.18 (+https://github.com/JeremyHennessy/HalifaxData)'})
          agenda = session.get(agenda_url, timeout=180)
          agenda.raise_for_status()

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.current = None; self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'a':
                      href = dict(attrs).get('href')
                      if href: self.current = {'href': href, 'text': []}
              def handle_data(self, data):
                  if self.current is not None: self.current['text'].append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'a' and self.current is not None:
                      self.current['text'] = re.sub(r'\s+', ' ', html.unescape(' '.join(self.current['text']))).strip()
                      self.links.append(self.current); self.current = None

          parser = LinkParser(); parser.feed(agenda.text)
          urls = {
              urljoin(agenda_url, link['href'])
              for link in parser.links
              if re.sub(r'\s+', ' ', link['text']).strip() == exact_title
          }
          if len(urls) != 1:
              raise SystemExit(f'expected one unique current-capital URL, found {sorted(urls)}')
          resolved_url = next(iter(urls))
          response = session.get(resolved_url, headers={'Referer': agenda_url}, timeout=180)
          response.raise_for_status()
          if not response.content.startswith(b'%PDF'):
              raise SystemExit('resolved source is not PDF')

          with pdfplumber.open(io.BytesIO(response.content)) as pdf:
              page = pdf.pages[8]
              tables = page.extract_tables() or []
              if len(tables) != 1:
                  raise SystemExit(f'Attachment 2 expected one table, found {len(tables)}')
              table = [[re.sub(r'\s+', ' ', str(cell or '')).strip() for cell in (row or [])] for row in tables[0]]
              print(f'resolved_url={resolved_url}')
              print(f'attachment2_rows={len(table)}')
              for index, row in enumerate(table, 1):
                  print(f'{index:03d}: {row}')
          PY
