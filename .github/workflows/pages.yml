name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify hosted dashboard
        env:
          HALIFAXDATA_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node tools/ui-smoke.mjs
          node tools/build014-ui-smoke.mjs
          node tools/build014-linkage-smoke.mjs
      - name: Upload hosted UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-ui-smoke-${{ github.sha }}
          path: artifacts/ui-smoke
          if-no-files-found: warn
          retention-days: 14
