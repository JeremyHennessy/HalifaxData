name: Refresh public data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: write

concurrency:
  group: halifaxdata-public-refresh
  cancel-in-progress: false

jobs:
  public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Refresh and validate all public domains
        run: python scripts/refresh_all.py
      - name: Commit verified changes atomically
        run: |
          if git diff --quiet -- data/sources.json data/generated; then
            echo "No public-data changes"
            exit 0
          fi
          git config user.name "halifaxdata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json data/generated
          git commit -m "data: refresh public finance datasets"
          git push
