name: Build 018 Budget Layout Diagnostic

on:
  push:
    branches: ['agent/build-018-current-source-refresh']
    paths:
      - '.github/workflows/build018-budget-page125-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Measure final-package service-area column separation
        run: |
          python - <<'PY'
          import io, json, re, requests
          from pathlib import Path
          import pdfplumber
          import sys
          sys.path.insert(0, 'scripts')
          import ingest_budget as base

          cfg = json.loads(Path('data/current_budget_sources.json').read_text(encoding='utf-8'))
          response = requests.get(
              cfg['budget_source']['url'],
              headers={
                  'User-Agent': 'HalifaxData/0.18 (+https://github.com/JeremyHennessy/HalifaxData)',
                  'Referer': cfg['approval_source']['url'],
              },
              timeout=180,
          )
          response.raise_for_status()
          if not response.content.startswith(b'%PDF'):
              raise SystemExit('final package response is not PDF')

          max_delta = None
          min_percent = None
          max_delta_row = None
          min_percent_row = None
          net_value_starts = []
          pages = 0
          candidate_rows = 0

          def text_of(row):
              return ' '.join(str(word.get('text') or '') for word in row)

          with pdfplumber.open(io.BytesIO(response.content)) as pdf:
              for page_number, page in enumerate(pdf.pages, 1):
                  text = page.extract_text() or ''
                  if 'SERVICE AREA BUDGET OVERVIEW' not in text.upper():
                      continue
                  rows = base.visual_rows(page)
                  header_index = None
                  for index, row in enumerate(rows):
                      low = text_of(row).lower()
                      if 'service area' in low and 'actual' in low and 'budget' in low and ('projection' in low or 'projections' in low):
                          header_index = index
                          break
                  if header_index is None:
                      raise SystemExit(f'page {page_number}: no service-area header')
                  pages += 1

                  for row in rows[header_index + 1:]:
                      row_text = text_of(row).strip()
                      low = row_text.lower()
                      if low.startswith('net total'):
                          value_tokens = [
                              word for word in row
                              if float(word.get('x0') or 0) > 150 and (
                                  str(word.get('text') or '').strip() == '$' or
                                  re.search(r'\d', str(word.get('text') or ''))
                              )
                          ]
                          if value_tokens:
                              net_value_starts.append((float(value_tokens[0]['x0']), page_number, row_text))

                      right = []
                      for word in row:
                          token = str(word.get('text') or '').strip()
                          x = float(word.get('x0') or 0)
                          if x < 466:
                              continue
                          if token == '$' or token in {'(', ')', '-', '–', '—'} or re.search(r'\d', token):
                              right.append((token, x))
                      # In the source tables the percent field is the rightmost numeric/dash token.
                      # Require it to start in the observed rightmost column so narrative/table noise
                      # cannot manufacture a false separation measurement.
                      if len(right) >= 2 and right[-1][1] >= 515:
                          candidate_rows += 1
                          pct_token, pct_x = right[-1]
                          delta_tokens = right[:-1]
                          delta_x = max(x for _, x in delta_tokens)
                          if max_delta is None or delta_x > max_delta:
                              max_delta = delta_x
                              max_delta_row = (page_number, row_text, right)
                          if min_percent is None or pct_x < min_percent:
                              min_percent = pct_x
                              min_percent_row = (page_number, row_text, right)
                      if low.startswith('net total'):
                          break

          print(f'overview_pages={pages}')
          print(f'candidate_rows={candidate_rows}')
          print(f'max_source_delta_token_x0={max_delta}')
          print(f'min_percent_token_x0={min_percent}')
          print(f'max_delta_row={max_delta_row}')
          print(f'min_percent_row={min_percent_row}')
          print(f'min_net_total_first_value_x0={min(net_value_starts) if net_value_starts else None}')
          if max_delta is None or min_percent is None or max_delta >= min_percent:
              raise SystemExit('No source-wide safe change/percent x-gap established')
          print(f'safe_gap=({max_delta}, {min_percent})')
          print(f'midpoint={(max_delta + min_percent) / 2:.2f}')
          PY
