name: Build 011 Procurement Layout Diagnostic

on:
  push:
    branches: ['agent/build-011-procurement-lifecycle']
    paths:
      - 'scripts/debug_procurement_quarterly_layout.py'
      - '.github/workflows/build011-procurement-layout-debug.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate diagnostic syntax
        run: python -m compileall -q scripts/debug_procurement_quarterly_layout.py
      - name: Capture source layout diagnostics
        run: python scripts/debug_procurement_quarterly_layout.py --output artifacts/procurement-layout.json
      - name: Upload layout diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: build011-procurement-layout-${{ github.sha }}
          path: artifacts/procurement-layout.json
          if-no-files-found: error
          retention-days: 3
