name: Budget diagnostic

on:
  push:
    branches: ['agent/build-004-budget-actuals']
    paths:
      - 'tools/budget_diag.py'
      - '.github/workflows/budget-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/budget_diag.py
