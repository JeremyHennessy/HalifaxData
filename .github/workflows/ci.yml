name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check domain-status.js
          node --check compensation-ui.js
          node --check budget-ui.js
          node --check build006-intelligence-ui.js
          node --check build008-investigations.js
          node --check build008-investigations-refinements.js
          node --check build009-pattern-detection.js
          node --check build009-pattern-detection-refinements.js
          node --check build010-current-capital.js
          node --check tools/ui-smoke.mjs
          node --check tools/build009-ui-smoke.mjs
          node --check tools/build010-ui-smoke.mjs
      - name: Validate Python syntax
        run: python -m compileall -q scripts
      - name: Validate established budget and compensation contracts
        run: python scripts/validate_data.py
      - name: Validate historical budgets
        run: python scripts/validate_budget_history.py
      - name: Validate audited financial history
        run: python scripts/validate_financial_history.py
      - name: Validate municipal benchmarks and external funding
        run: python scripts/validate_municipal_benchmarks.py
      - name: Validate Council calendar and document graph
        run: python scripts/validate_council.py
      - name: Validate quarterly spending summaries
        run: python scripts/validate_spending.py
      - name: Validate Build 007 payment-source status
        run: python scripts/validate_payment_source_status.py
      - name: Validate Build 010 current capital
        run: python scripts/validate_current_capital.py
      - name: Validate final normalized entity index
        run: |
          python scripts/build_entity_index_v4.py --check
          python scripts/validate_entity_index_v4.py
      - name: Validate published domain lifecycle
        run: python scripts/validate_domain_status.py
      - name: Validate repository diff hygiene
        run: git diff --check
