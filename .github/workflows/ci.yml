name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check domain-status.js
          node --check compensation-ui.js
          node --check budget-ui.js
          node --check build006-intelligence-ui.js
          node --check build008-investigations.js
          node --check build008-investigations-refinements.js
          node --check build009-pattern-detection.js
          node --check build009-pattern-detection-refinements.js
          node --check build010-startup-guard.js
          node --check build010-current-capital.js
          node --check build010-current-capital-refinements.js
          node --check build011-procurement-lifecycle.js
          node --check build011-procurement-lifecycle-refinements.js
          node --check build012-integrity-oversight.js
          node --check build013-context-expansion.js
          node --check build013-current-grants.js
          node --check build013-context-expansion-refinements.js
          node --check build014-contract-amendment-series.js
          node --check build014-contract-amendment-links.js
          node --check build015-current-fiscal-refresh.js
          node --check build016-council-decisions.js
          node --check build017-audited-financial-history.js
          node --check build018-current-source-refresh.js
          node --check build019-lifecycle-investigations.js
          node --check tools/ui-smoke.mjs
          node --check tools/build009-ui-smoke.mjs
          node --check tools/build010-ui-smoke.mjs
          node --check tools/build010-startup-race.mjs
          node --check tools/build011-ui-smoke.mjs
          node --check tools/build012-ui-smoke.mjs
          node --check tools/build013-ui-smoke.mjs
          node --check tools/build014-ui-smoke.mjs
          node --check tools/build014-linkage-smoke.mjs
          node --check tools/build015-ui-smoke.mjs
          node --check tools/build016-ui-smoke.mjs
          node --check tools/build017-ui-smoke.mjs
          node --check tools/build018-ui-smoke.mjs
          node --check tools/build019-ui-smoke.mjs
      - name: Validate Python syntax
        run: python -m compileall -q scripts
      - name: Validate established budget and compensation contracts
        run: python scripts/validate_data.py
      - name: Validate historical budgets
        run: python scripts/validate_budget_history.py
      - name: Validate audited financial history
        run: python scripts/validate_financial_history.py
      - name: Validate Build 017 audited source-year expansion
        run: python scripts/validate_financial_history_build017.py
      - name: Validate Build 018 ratified current budget
        run: python scripts/validate_current_budget_build018.py
      - name: Validate municipal benchmarks and external funding
        run: python scripts/validate_municipal_benchmarks.py
      - name: Validate Council calendar and document graph
        run: python scripts/validate_council.py
      - name: Validate Build 016 Council decision evidence
        run: python scripts/validate_council_decisions.py
      - name: Validate quarterly spending summaries
        run: python scripts/validate_spending.py
      - name: Validate Build 007 payment-source status
        run: python scripts/validate_payment_source_status.py
      - name: Validate Build 019 payment-source research boundary
        run: python scripts/validate_payment_source_research_build019.py
      - name: Validate Build 010 current capital
        run: python scripts/validate_current_capital.py
      - name: Validate Build 018 current capital schedule
        run: python scripts/validate_current_capital_build018.py
      - name: Validate Build 011 procurement lifecycle
        run: python scripts/validate_procurement_quarterly.py
      - name: Validate Build 012 integrity oversight
        run: python scripts/validate_integrity_oversight.py
      - name: Validate Build 013 context expansion
        run: python scripts/validate_context_expansion.py
      - name: Validate Build 014 CAO amendment series
        run: python scripts/validate_contract_amendments.py
      - name: Validate Build 019 deterministic lifecycle reconciliation
        run: |
          python scripts/validate_lifecycle_reconciliation_build019.py
          python scripts/validate_capital_identifier_policy_build019.py
          python scripts/validate_lifecycle_components_build019.py
      - name: Validate Build 019 lifecycle investigation queue
        run: python scripts/validate_lifecycle_investigations_build019.py
      - name: Validate final normalized entity index
        run: |
          python scripts/build_entity_index_v4.py --check
          python scripts/validate_entity_index_v4.py
      - name: Validate published domain lifecycle
        run: python scripts/validate_domain_status.py
      - name: Validate repository diff hygiene
        run: git diff --check
