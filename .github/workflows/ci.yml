name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check compensation-ui.js
          node --check budget-ui.js
          node --check domains-ui.js
          node --check tools/ui-smoke.mjs
      - name: Validate Python syntax
        run: python -m compileall -q scripts
      - name: Validate compensation and current budget data
        run: python scripts/validate_data.py
      - name: Validate multi-domain data contracts
        run: python scripts/validate_domains.py
