name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check compensation-ui.js
          node --check budget-ui.js
      - name: Validate Python syntax
        run: python -m compileall -q scripts
      - name: Validate checked-in data
        run: python scripts/validate_data.py
      - name: Validate audited financial history
        run: |
          if [ -f data/generated/financials.json ]; then
            python scripts/validate_financial_history.py
          else
            echo "financials.json not checked in yet; audited-financial workflow must generate it before merge."
          fi
      - name: Validate normalized entity index
        run: |
          if [ -f data/generated/entity_index.json ]; then
            python scripts/build_entity_index.py --check
            python scripts/validate_entity_index.py
          else
            echo "entity_index.json not checked in yet; normalization workflow must generate it before merge."
          fi
