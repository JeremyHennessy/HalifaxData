name: Build 003 external diagnostics

on:
  push:
    branches: ['agent/build-003-full-data-ingestion']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/diagnose_external_endpoints.py
