name: Build 020 Release Council Archive Once

on:
  push:
    branches: ['agent/build020-tax-payment-graph']
    paths: ['.github/workflows/build020-release-council-archive-once.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Regenerate official Regional Council historical archive
        run: python scripts/ingest_council_archive_build020.py --output artifacts/build020-council-archive.json
      - name: Validate release candidate
        run: python scripts/validate_council_archive_build020.py --candidate artifacts/build020-council-archive.json
      - name: Promote candidate to checked-in release form
        run: python scripts/promote_council_archive_build020.py --candidate artifacts/build020-council-archive.json --output data/generated/council_archive.json
      - name: Validate released archive
        run: python scripts/validate_council_archive_release_build020.py
      - name: Remove ephemeral proof outputs
        run: |
          rm -rf artifacts
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Assert only Council archive changed
        run: |
          git diff --check
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          echo "Changed files:"
          printf '%s\n' "$changed"
          test "$changed" = "data/generated/council_archive.json"
      - name: Commit validated Council archive inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/council_archive.json
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Build 020: release Regional Council historical archive inventory'
          git push origin HEAD:agent/build020-tax-payment-graph
