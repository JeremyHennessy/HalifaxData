name: Diagnose compensation PDF

on:
  push:
    branches: ['agent/build-002-compensation-bootstrap']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/diagnose_2025_compensation.py
