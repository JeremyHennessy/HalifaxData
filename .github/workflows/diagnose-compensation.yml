name: Diagnose compensation extraction

on:
  push:
    branches: ['agent/build-002-compensation-bootstrap']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Rebuild compensation data in isolated runner
        run: python scripts/ingest_compensation.py
      - name: Validate rebuilt data
        run: python scripts/validate_data.py
