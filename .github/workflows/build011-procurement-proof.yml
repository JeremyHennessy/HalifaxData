name: Build 011 Procurement Quarterly Proof

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ingest_procurement_quarterly_reports.py'
      - 'scripts/ingest_procurement_quarterly_resolved.py'
      - 'scripts/validate_procurement_quarterly.py'
      - 'data/generated/procurement_quarterly.json'
      - 'data/generated/council_documents.json'
      - '.github/workflows/build011-procurement-proof.yml'
  pull_request:
    paths:
      - 'scripts/ingest_procurement_quarterly_reports.py'
      - 'scripts/ingest_procurement_quarterly_resolved.py'
      - 'scripts/validate_procurement_quarterly.py'
      - 'data/generated/procurement_quarterly.json'
      - 'data/generated/council_documents.json'
      - '.github/workflows/build011-procurement-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q scripts/ingest_procurement_quarterly_reports.py scripts/ingest_procurement_quarterly_resolved.py scripts/validate_procurement_quarterly.py
      - name: Validate checked procurement lifecycle artifact
        run: python scripts/validate_procurement_quarterly.py data/generated/procurement_quarterly.json
      - name: Validate preserved quarterly-report source identity
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('data/generated/procurement_quarterly.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          meta=data.get('metadata') or {}
          reports=data.get('reports') or []
          rows=data.get('alternative_procurement') or []
          if meta.get('dataset_status') != 'official_quarterly_alternative_procurement_report_sections':
              raise SystemExit(f"unexpected dataset status: {meta.get('dataset_status')!r}")
          if meta.get('report_count') != 8 or len(reports) != 8:
              raise SystemExit(f"expected 8 checked reports, got metadata={meta.get('report_count')} rows={len(reports)}")
          if meta.get('alternative_procurement_rows') != 84 or len(rows) != 84:
              raise SystemExit(f"expected 84 checked alternative-procurement rows, got metadata={meta.get('alternative_procurement_rows')} rows={len(rows)}")
          for report in reports:
              doc=str(report.get('document_id') or '')
              registry=str(report.get('source_url_registry') or report.get('url') or '')
              agenda=str(report.get('agenda_url') or '')
              if not doc or f'DocumentId={doc}'.lower() not in registry.lower():
                  raise SystemExit(f"report {doc!r} lost exact historical document identity")
              if 'pub-halifax.escribemeetings.com/Meeting.aspx' not in agenda:
                  raise SystemExit(f"report {doc!r} lost owning official agenda URL")
              if report.get('control_count_reconciled') is not True or report.get('control_value_reconciled') is not True:
                  raise SystemExit(f"report {doc!r} lost source reconciliation controls")
          Path('artifacts/procurement_quarterly.json').write_bytes(path.read_bytes())
          print('checked quarterly procurement evidence validated with exact report/document provenance; live transport is monitored separately')
          PY
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build011-procurement-quarterly-${{ github.sha }}
          path: artifacts/procurement_quarterly.json
          if-no-files-found: warn
          retention-days: 14
