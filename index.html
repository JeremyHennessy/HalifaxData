<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HalifaxData — public-finance intelligence for Halifax Regional Municipality." />
  <title>HalifaxData</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">H</div>
        <div><strong>HalifaxData</strong><span>Public finance intelligence</span></div>
      </div>
      <nav id="nav" aria-label="Primary">
        <button class="nav-item active" data-view="overview">Overview</button>
        <button class="nav-item" data-view="compensation">Compensation</button>
        <button class="nav-item" data-view="flags">Review signals</button>
        <button class="nav-item" data-view="sources">Source registry</button>
      </nav>
      <div class="sidebar-note">
        <span class="status-dot"></span>
        <div><strong>Evidence first</strong><small>Signals require source-level verification before conclusions.</small></div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow">HALIFAX REGIONAL MUNICIPALITY</p>
          <h1 id="view-title">Financial intelligence overview</h1>
        </div>
        <div class="topbar-meta"><span id="coverage-label">Loading…</span><span class="pill">Build 001</span></div>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
